# Native ad-blocking spike (ROADMAP P5.13). Point ADBLOCK_RUST at a checkout of brave/adblock-rust.
[package]
name = "thoron-adblock-bench"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
adblock = { path = "../../../../adblock-rust" }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
